<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié | DATENSIS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="tpe-auth login-page">
<main class="dashboard-page">
<section class="auth-section">
<article class="auth-card">
    <div class="auth-space-badge">Indépendants & TPE</div>
    <h1>Mot de passe oublié</h1>
    <p class="auth-intro">Indiquez votre adresse e-mail pour recevoir un lien sécurisé valable 30 minutes.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="form-message form-message-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form class="journey-form" method="POST" action="{{ url_for('main.mot_de_passe_oublie', profil='tpe') }}}}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="email">Adresse e-mail</label>
<input id="email" type="email" name="email" autocomplete="email" maxlength="254" required>
<button type="submit" class="btn-primary">Recevoir un lien de réinitialisation</button>
    </form>
    <div class="account-back">
        <a href="{{ url_for('main.tpe_connexion') }}">← Retour à la connexion</a>
    </div>
</article>
</section>
</main>
</body>
</html>
