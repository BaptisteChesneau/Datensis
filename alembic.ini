
# ============================================================
# DATENSIS - CONFIGURATION ALEMBIC
# Gestion des migrations de la base de donnees
# ============================================================

[alembic]

# Dossier contenant les migrations
script_location = %(here)s/migrations

# Ajouter la racine du projet au chemin Python
prepend_sys_path = .

# Separateur adapte au systeme d'exploitation
path_separator = os

# Encodage des fichiers de migration
output_encoding = utf-8

# ============================================================
# CONNEXION A LA BASE DE DONNEES
# ============================================================

# Ne jamais enregistrer les identifiants PostgreSQL ici.
# L'URL doit etre configuree dans migrations/env.py
# depuis DATABASE_URL ou la configuration Flask.
sqlalchemy.url =


# ============================================================
# HOOKS APRES GENERATION DES MIGRATIONS
# ============================================================

[post_write_hooks]

# Aucun hook supplementaire configure.


# ============================================================
# JOURNALISATION
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
