name: DATENSIS - Tests et securite
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATENSIS_SECRET_KEY: ci-only-not-a-production-key-123456789012345
      DATENSIS_HTTPS: '0'
      SMTP_HOST: localhost
      SMTP_PORT: '587'
      SMTP_FROM: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check app tests --output-format github
      - name: Bandit
        run: python -m bandit -r app -ll -q
      - name: Audit des dependances
        run: |
          if [ -f requirements.txt ]; then python -m pip_audit -r requirements.txt; else python -m pip_audit; fi
      - name: Tests
        run: python -m pytest -q tests --cov=app --cov-report=term-missing
